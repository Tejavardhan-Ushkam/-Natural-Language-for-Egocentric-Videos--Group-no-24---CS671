WORKERS: 0
DEBUG: False

MODEL_DIR: ./checkpoints
RESULT_DIR: ./results2
LOG_DIR: ./log
DATA_DIR: ./data/Ego4D_clip

DATASET:
  NAME: Ego4DClip
  VIS_INPUT_TYPE: EgoVLP #clip earlier
  NO_VAL: False
  NUM_SAMPLE_CLIPS: 8     #40 earlier--> reduced Time Complexity -->8 for new pipeline, change back to 40 for old pipeline
  TARGET_STRIDE: 1
  NORMALIZE: True
  RANDOM_SAMPLING: False
  WINDOW: 40 # we use 40s window to cut the videos @sharma ji

TEST:
  BATCH_SIZE: 16
  RECALL: 1,5
  TIOU: 0.3,0.5
  EVAL_TRAIN: True
  NMS_THRESH: 0.5

CUDNN:
  DETERMINISTIC: False
  BENCHMARK: True

TRAIN:
  BATCH_SIZE: 32
  LR: 0.00005
  WEIGHT_DECAY: 0.0001
  MAX_EPOCH: 600 #200 earlier
  CONTINUE: False

LOSS:
  NAME: bce_rescale_loss
  PARAMS:
    MIN_IOU: 0.3
    MAX_IOU: 1.0
    BIAS: 0.3

TAN:
  FRAME_MODULE:
    NAME: FrameAvgPool
    PARAMS:
      INPUT_SIZE: 256 #old - 512
      HIDDEN_SIZE: 256 #old - 512
      KERNEL_SIZE: 1
      STRIDE: 1

  PROP_MODULE:
    NAME: SparsePropMaxPool
    PARAMS:
      NUM_SCALE_LAYERS: [16,8,8]

  FUSION_MODULE:
    NAME: BaseFusion
    PARAMS:
      HIDDEN_SIZE: 256 #old - 512
      TXT_INPUT_SIZE: 300
      TXT_HIDDEN_SIZE: 768
      LSTM:
        NUM_LAYERS: 3
        BIDIRECTIONAL: False

  MAP_MODULE:
    NAME: MapConv
    PARAMS:
      INPUT_SIZE: 256 #old - 512
      HIDDEN_SIZES: [256, 256, 256, 256] #old - all 512
      KERNEL_SIZES: [9, 9, 9, 9]
      STRIDES: [1, 1, 1, 1]
      PADDINGS: [16, 0, 0, 0]
      DILATIONS: [1, 1, 1, 1]

  PRED_INPUT_SIZE: 256 #old - 512

MODEL:
  NAME: TAN
  CHECKPOINT: checkpoints/Ego4DClip/TAN_EgoVLP/iter084500-0.0000-0.0000.pkl #checkpoints/Ego4DClip/TAN_slowfast/iter005030-0.0530-0.1242.pkl
